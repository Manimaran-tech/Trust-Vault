[package]
name = "core-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rskafka = "0.5"
uuid = { version = "1.8", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
deadpool-redis = "0.23.1"
chrono = "0.4.45"
